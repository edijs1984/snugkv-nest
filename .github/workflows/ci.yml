name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # Builds the SnugKV server the tests talk to. If the snugkv repo is
      # private, add a read-only token as the SNUGKV_REPO_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: edijs1984/snugkv
          path: snugkv-src
          token: ${{ secrets.SNUGKV_REPO_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: snugkv-src/go.mod
          cache-dependency-path: snugkv-src/go.sum
      - run: cd snugkv-src && go build -o "$RUNNER_TEMP/snugkv" ./cmd/snugkv
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
        env:
          SNUGKV_BIN: ${{ runner.temp }}/snugkv
